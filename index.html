<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle da Base - Robô</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #2a2a40; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #00d2ff; }
        .status { margin-bottom: 20px; font-size: 0.9em; padding: 8px; border-radius: 6px; background: #ff4a4a; font-weight: bold; }
        .status.connected { background: #00d2ff; color: #1e1e2f; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-connect { background: #4caf50; color: white; margin-bottom: 15px; }
        .btn-connect:hover { background: #45a049; }
        .btn-start { background: #00d2ff; color: #1e1e2f; }
        .btn-start:hover { background: #0098cc; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>Navegação da Base</h2>
    <div id="status" class="status">Desconectado do ESP32</div>
    
    <button class="btn-connect" id="btnConectar" onclick="conectarBluetooth()">1. Conectar ao Robô</button>
    <button class="btn-start" id="btnEnviar" onclick="enviarComando()" disabled>2. Iniciar Sequência</button>
</div>

<script>
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
    
    let bleCharacteristic;

    async function conectarBluetooth() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'RoboBase_ESP32' }],
                optionalServices: [SERVICE_UUID]
            });

            device.addEventListener('gattserverdisconnected', onDisconnected);
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            document.getElementById("status").textContent = "Conectado via BLE!";
            document.getElementById("status").className = "status connected";
            document.getElementById("btnEnviar").disabled = false;
            document.getElementById("btnConectar").style.display = 'none';

        } catch (error) {
            console.log('Falha: ' + error);
            alert('Erro ao conectar. Ative o Bluetooth e use Chrome ou Edge.');
        }
    }

    function onDisconnected() {
        document.getElementById("status").textContent = "Desconectado do ESP32";
        document.getElementById("status").className = "status";
        document.getElementById("btnEnviar").disabled = true;
        document.getElementById("btnConectar").style.display = 'block';
    }

    async function enviarComando() {
        if (!bleCharacteristic) return;
        
        try {
            const encoder = new TextEncoder();
            const data = encoder.encode("START"); // Envia um comando simples
            await bleCharacteristic.writeValue(data);
            alert("Comando enviado! O robô iniciará o trajeto.");
        } catch (error) {
            console.log('Erro ao enviar: ', error);
            alert('Falha ao enviar o comando.');
        }
    }
</script>
</body>
</html>
